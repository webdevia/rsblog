# Builds the production api image (postgres backend, release) and pushes it
# to GitHub Container Registry on every push to master.
#
# One-time setup: none — GITHUB_TOKEN already has packages:write via the
# `permissions:` block below. Make the package public afterwards if the VPS
# pulls without logging in (ghcr.io/<owner> → package settings → visibility).
#
# The VPS then deploys with: API_IMAGE=ghcr.io/<owner>/rsblog:latest
# See DEPLOY.md for the full procedure.

name: docker

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "migrations/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
