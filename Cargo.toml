[package]
name = "blog-api"
version = "0.1.0"
edition = "2021"

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
all-databases = ["sqlite", "postgres"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace", "limit", "request-id", "set-header", "timeout"] }

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "chrono", "migrate", "uuid"] }

# Auth
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
argon2 = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Validation
validator = { version = "0.21", features = ["derive"] }

# Config & Error Handling
dotenvy = "0.15"
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Highly performant rate limiter
governor = { version = "0.10", features = ["std", "jitter"] }

[dev-dependencies]
# HTTP client for end-to-end tests (plain HTTP only, no TLS backend needed)
reqwest = { version = "0.12", default-features = false, features = ["json"] }
